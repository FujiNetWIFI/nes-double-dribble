# ld65 config for bank 8, the netcode bank. WRAM is the cart's $6000-$7FFF
# (requested by the NES 2.0 header the build writes): data from $6000, the
# hook trampolines run at $7F00 and are copied there at boot.
MEMORY {
    RINGS: start = $6000, size = $0300, type = rw, file = "";
    STAT:  start = $6300, size = $0100, type = rw, file = "";
    RAM:   start = $6400, size = $0300, type = rw, file = "";
    IMG:   start = $6700, size = $1000, type = rw, file = "";
    TRACE: start = $7700, size = $0800, type = rw, file = "";
    TRAM:  start = $7F00, size = $0100, type = rw, file = "";
    B8:    start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    RINGS:  load = RINGS, type = bss;
    STAT:   load = STAT,  type = bss;
    BSS:    load = RAM,   type = bss;
    IMG:    load = IMG,   type = bss;
    TRACE:  load = TRACE, type = bss;
    B8HEAD: load = B8,    type = ro, start = $8000;
    CODE:   load = B8,    type = ro;
    RODATA: load = B8,    type = ro;
    TRAMP:  load = B8, run = TRAM, type = ro, define = yes;
}
